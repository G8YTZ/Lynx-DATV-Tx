# Lynx-Tx: Home Assistant example configuration
# ============================================================================
# The configuration.yaml sections behind GB3OO's Lynx-Tx dashboard page
# (lynx_tx_dashboard.yaml) and alarms (lynx_tx_alarms.yaml). Working, tested
# values from GB3OO; copy the sections you need into your own configuration.yaml.
#
# SEARCH FOR  CHANGE-ME  in all three files: every value specific to GB3OO
# is marked with it.
#
# The callsign: Names here start "GB3OO", and Home Assistant makes the entity
# IDs from the names (sensor.gb3oo_lynx_tx_state and so on), which the
# dashboard and the alarms use. To use your own callsign, search and replace
# in all three files at once, matching case:
#     GB3OO -> your callsign in capitals     gb3oo -> in lower case
#
# Merge rather than paste: if your configuration.yaml already has "modbus:",
# "sensor:" or "template:", add these entries under your existing key; a key
# may appear only once.
#
# After editing: Developer tools, YAML, Check configuration, then
# Settings, System, Restart (the SNMP and Modbus sensors load only at start).
# ============================================================================

# ── The PA's Modbus relay board (ComWinTop, Modbus TCP) ─────────────────────
modbus:
  - name: GB3OO                # CHANGE-ME: your callsign (see the note at the top)
    type: tcp
    host: 192.168.60.75        # CHANGE-ME: your Modbus relay board's address
    port: 502
    # CHANGE-ME: the register and coil numbers below are GB3OO's wiring:
    # inputs 0 drive temperature, 2 PA case, 3 heatsink, 4 forward power,
    # 5 return loss (no probe fitted yet); coils 0 drive, 1 PA, 2 ATEM.
    sensors:
      - name: GB3OO PA Heatsink
        slave: 1
        address: 3
        input_type: input
        unit_of_measurement: °C
        state_class: measurement
        scale: 0.1
        offset: 0
        precision: 0.01
      - name: GB3OO PA Case
        slave: 1
        address: 2
        input_type: input
        unit_of_measurement: °C
        state_class: measurement
        scale: 0.1
        offset: 0
        precision: 0.01
      - name: GB3OO Drive
        slave: 1
        address: 0
        input_type: input
        state_class: measurement
        unit_of_measurement: °C
        scale: 0.1
        offset: 0
        precision: 0.01
      - name: GB3OO Forward Power
        slave: 1
        address: 4
        input_type: input
        unit_of_measurement: ""
        state_class: measurement
        scale: 1
        offset: 0
        precision: 0
      - name: GB3OO Return Loss
        slave: 1
        address: 5
        input_type: input
        unit_of_measurement: dB
        state_class: measurement
        scale: 1
        offset: 0
        precision: 0.01
    switches:
      - name: GB3OO Drive
        slave: 1
        address: 0
        write_type: coil
        verify:
      - name: GB3OO PA
        slave: 1
        address: 1
        write_type: coil
        verify:
      - name: GB3OO ATEM
        slave: 1
        address: 2
        write_type: coil
        verify:

