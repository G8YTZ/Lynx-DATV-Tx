template:
  - sensor:

      # ── The PA's forward power and temperatures, from the Modbus board ──
      - name: "GB3OO Forward Power Watts"
        unique_id: gb3oo_forward_power_watts
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        state: >
          {% set raw = states('sensor.gb3oo_forward_power') | float(0) %}
          {% set offset = 0.0375 %}   {# CHANGE-ME: your detector's zero, V #}
          {% set volts = (raw * 10.0 / 65535.0) - offset %}
          {% set volts = [volts, 0] | max %}
          {% set power_at_meter = (volts * volts) / 50.0 %}
          {% set forward_power = power_at_meter * 10000 %}   {# CHANGE-ME: coupler factor; 10000 x V^2/50 = 200 W per V^2 #}
          {{ forward_power | round(1) }}

      - name: "GB3OO PA Heatsink (Held)"
        unique_id: gb3oo_pa_heatsink_held
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set raw = states('sensor.gb3oo_pa_heatsink') %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] %}
            {{ [((raw | float) - 10), 70] | min }}   {# CHANGE-ME: -10 is this sensor's calibration #}
          {% else %}
            {{ this.state if this.state not in ['unknown', 'unavailable', 'none', None] else 0 }}
          {% endif %}

      - name: "GB3OO PA Case (Held)"
        unique_id: gb3oo_pa_case_held
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set raw = states('sensor.gb3oo_pa_case') %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] %}
            {{ raw }}
          {% else %}
            {{ this.state if this.state not in ['unknown', 'unavailable', 'none', None] else 0 }}
          {% endif %}

      - name: "GB3OO Drive (Held)"
        unique_id: gb3oo_drive_held
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set raw = states('sensor.gb3oo_drive') %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] %}
            {{ raw }}
          {% else %}
            {{ this.state if this.state not in ['unknown', 'unavailable', 'none', None] else 0 }}
          {% endif %}

      # ── The UPS in words (optional, with the UPS block) ──
      - name: UPS State
        unique_id: ups_state_gb3oo
        state: >
          {% set s = states('sensor.ups_status') %}
          {% if s == '2' %} Online
          {% elif s == '3' %} On Battery
          {% elif s == '4' %} Smart Boost
          {% elif s == '5' %} On Bypass
          {% elif s == '6' %} Off
          {% elif s == '7' %} Rebooting
          {% elif s == '12' %} Smart Trim
          {% else %} Unknown ({{ s }})
          {% endif %}
        icon: >
          {% set s = states('sensor.ups_status') %}
          {% if s == '2' %} mdi:power-plug
          {% elif s == '3' %} mdi:battery-alert
          {% elif s in ['4','12'] %} mdi:sine-wave
          {% elif s == '5' %} mdi:transit-connection-variant
          {% else %} mdi:help-circle-outline
          {% endif %}

      - name: UPS Battery Health
        unique_id: ups_battery_health_gb3oo
        state: >
          {% set s = states('sensor.ups_battery_replace') %}
          {% if s == '1' %} OK
          {% elif s == '2' %} Replace battery
          {% else %} Unknown ({{ s }})
          {% endif %}
        icon: >
          {% set s = states('sensor.ups_battery_replace') %}
          {% if s == '1' %} mdi:battery-check
          {% elif s == '2' %} mdi:battery-remove
          {% else %} mdi:help-circle-outline
          {% endif %}

      - name: UPS Transfer Reason
        unique_id: ups_transfer_reason_gb3oo
        state: >
          {% set s = states('sensor.ups_last_transfer_reason') %}
          {% if s == '1' %} No transfers
          {% elif s == '2' %} High line voltage
          {% elif s == '3' %} Brownout
          {% elif s == '4' %} Blackout
          {% elif s == '5' %} Small sag
          {% elif s == '6' %} Deep sag
          {% elif s == '7' %} Small spike
          {% elif s == '8' %} Large spike
          {% elif s == '9' %} Self test
          {% elif s == '10' %} Rate of change
          {% else %} Unknown ({{ s }})
          {% endif %}
        icon: >
          {% set s = states('sensor.ups_last_transfer_reason') %}
          {% if s == '1' %} mdi:check-circle-outline
          {% elif s in ['2','7','8'] %} mdi:flash-alert
          {% elif s in ['3','5','6'] %} mdi:trending-down
          {% elif s == '4' %} mdi:power-plug-off
          {% elif s == '9' %} mdi:test-tube
          {% else %} mdi:help-circle-outline
