# Lynx-Tx: Home Assistant example dashboard page (GB3OO)
# ============================================================================
# One whole view (page): Lynx-Tx, PA and drive control, the Lynx Deck, the
# PA's temperatures and forward power, and the UPS. It needs the sensors in
# lynx_tx_configuration.yaml.
#
# To add it: open the dashboard, Edit, three dots, Raw configuration editor,
# and paste this as one entry under "views:" (indent it to match).
#
# SEARCH FOR  CHANGE-ME  for the values specific to GB3OO. The entity IDs
# all start gb3oo_: replace gb3oo with your callsign in lower case, as in
# the configuration file. Leave out the Lynx Deck or UPS sections if you
# have not set those up.
# ============================================================================
type: sections
max_columns: 3
title: GB3OO Lynx-Tx
icon: mdi:radio-tower
header:
  layout: center
  badges_position: bottom
  badges_wrap: wrap
sections:
  - type: grid
    cards:
      - type: heading
        heading: Lynx-Tx
        icon: mdi:broadcast
      - type: tile
        entity: sensor.gb3oo_lynx_tx_state
        name: Transmitter
        color: green
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_state
            state: On Air
      - type: tile
        entity: sensor.gb3oo_lynx_tx_state
        name: Transmitter
        color: amber
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_state
            state:
              - Muted by SDR
              - Fault
      - type: tile
        entity: sensor.gb3oo_lynx_tx_state
        name: Transmitter
        color: red
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_state
            state: Lockout
      - type: tile
        entity: sensor.gb3oo_lynx_tx_state
        name: Transmitter
        color: grey
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_state
            state_not:
              - On Air
              - Muted by SDR
              - Fault
              - Lockout
      - type: tile
        entity: sensor.gb3oo_lynx_tx_reference_state
        name: 10 MHz Reference
        color: green
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_reference_state
            state: Locked
      - type: tile
        entity: sensor.gb3oo_lynx_tx_reference_state
        name: 10 MHz Reference
        color: amber
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_reference_state
            state:
              - Holdover
              - Acquiring
      - type: tile
        entity: sensor.gb3oo_lynx_tx_reference_state
        name: 10 MHz Reference
        color: grey
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_reference_state
            state_not:
              - Locked
              - Holdover
              - Acquiring
      - type: tile
        entity: sensor.gb3oo_lynx_tx_sdr_state
        name: SDR
        color: green
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_sdr_state
            state: Reachable
      - type: tile
        entity: sensor.gb3oo_lynx_tx_sdr_state
        name: SDR
        color: red
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_sdr_state
            state_not: Reachable
      - type: tile
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_camera_state
            state: Live
        entity: sensor.gb3oo_lynx_tx_camera_state
        name: ATEM
        color: green
        vertical: false
        features_position: bottom
      - type: tile
        entity: sensor.gb3oo_lynx_tx_camera_state
        name: Camera
        color: amber
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_camera_state
            state: HDMI unstable
      - type: tile
        entity: sensor.gb3oo_lynx_tx_camera_state
        name: Camera
        color: grey
        grid_options:
          columns: 4
        visibility:
          - condition: state
            entity: sensor.gb3oo_lynx_tx_camera_state
            state_not:
              - Live
              - HDMI unstable
      - type: tile
        entity: sensor.gb3oo_lynx_tx_mixer_state
