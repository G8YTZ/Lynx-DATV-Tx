# Lynx-Tx for Home Assistant: every sensor and alarm in one package.
#
# 1. In configuration.yaml, once:
#      homeassistant:
#        packages: !include_dir_named packages
# 2. Copy this file to /config/packages/lynx_tx.yaml.
# 3. Replace 192.168.0.50 (every "host:") with your ROCK's LAN address, and
#    notify.mobile_app_your_iphone with your own phone's notify service.
# 4. Settings, System, Restart.
#
# Everything here reads Lynx-Tx over SNMP (the Monitoring Guide has the full
# list of objects). It is read-only: nothing on the transmit path depends on
# it, and if Home Assistant stops, the transmitter carries on.
#
# Version 1.2, 25 November 2026: PA control and Automatic Drive Control
# (objects 19 to 24) added.

sensor:
  # ── The transmitter ────────────────────────────────────────────────
  - platform: snmp
    name: Lynx-Tx state
    unique_id: lynx_tx_state
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.1.0
    value_template: >-
      {{ {'1': 'idle', '2': 'on air', '3': 'muted by the SDR', '4': 'fault', '5': 'lockout'}.get(value, 'unknown') }}

  - platform: snmp
    name: Lynx-Tx reference
    unique_id: lynx_tx_reference
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.3.0
    value_template: >-
      {{ {'1': 'locked', '2': 'acquiring', '3': 'holdover', '4': 'absent'}.get(value, 'unknown') }}

  - platform: snmp
    name: Lynx-Tx camera
    unique_id: lynx_tx_camera
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.13.0
    value_template: >-
      {{ {'1': 'live', '2': 'colour bars', '3': 'unstable'}.get(value, 'unknown') }}

  # ── The PA and Automatic Drive Control ─────────────────────────────
  - platform: snmp
    name: Lynx-Tx PA relays
    unique_id: lynx_tx_pa_relays
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.19.0
    value_template: >-
      {{ {'1': 'on', '2': 'off', '3': 'not answering', '4': 'not configured', '5': 'partly on'}.get(value, 'unknown') }}

  - platform: snmp
    name: Lynx-Tx forward power
    unique_id: lynx_tx_forward_power
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.20.0
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    value_template: "{{ (value | int / 10) | round(1) }}"

  - platform: snmp
    name: Lynx-Tx drive control
    unique_id: lynx_tx_drive_control
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.21.0
    value_template: >-
      {{ {'1': 'off', '2': 'standby', '3': 'settling', '4': 'tracking', '5': 'on target',
          '6': 'at maximum drive', '7': 'at minimum drive', '8': 'held'}.get(value, 'unknown') }}

  - platform: snmp
    name: Lynx-Tx drive
    unique_id: lynx_tx_drive
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.22.0
    unit_of_measurement: "dB"
    state_class: measurement
    value_template: "{{ (value | int / 100) | round(2) }}"

  - platform: snmp
    name: Lynx-Tx power lock
    unique_id: lynx_tx_power_lock
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.23.0
    value_template: "{{ {'1': 'locked', '2': 'unlocked'}.get(value, 'unknown') }}"

  - platform: snmp
    name: Lynx-Tx PA fault
    unique_id: lynx_tx_pa_fault
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.24.0
    value_template: "{{ {'1': 'none', '2': 'fault'}.get(value, 'unknown') }}"

  # ── The ROCK itself ────────────────────────────────────────────────
  - platform: snmp
    name: Lynx-Tx ROCK temperature
    unique_id: lynx_tx_temp
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.12.0
    unit_of_measurement: "°C"
    device_class: temperature
    value_template: "{{ (value | int / 10) | round(1) }}"

  - platform: snmp
    name: Lynx-Tx ROCK fan
    unique_id: lynx_tx_fan
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.15.0
    unit_of_measurement: "%"

  - platform: snmp
    name: Lynx-Tx ROCK uptime
    unique_id: lynx_tx_uptime
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.16.0
    unit_of_measurement: "h"
    value_template: "{{ (value | int / 3600) | round(1) }}"

  - platform: snmp
    name: Lynx-Tx ROCK load
    unique_id: lynx_tx_load
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.17.0
    unit_of_measurement: "%"

  - platform: snmp
    name: Lynx-Tx ROCK free space
    unique_id: lynx_tx_disk_free
    host: 192.168.0.50
    community: lynx
    version: "2c"
    baseoid: 1.3.6.1.4.1.8072.9999.1.1.18.0
    unit_of_measurement: "GB"
    value_template: "{{ (value | int / 1024) | round(1) }}"

automation:
  - id: lynx_tx_alarm
    alias: Lynx-Tx alarm
    mode: queued
    triggers:
      # Needs a person now: no waiting.
      - trigger: state
        entity_id: sensor.lynx_tx_state
        to: "lockout"
        id: "Lockout: the transmitter has given up restarting itself"
      - trigger: state
        entity_id: sensor.lynx_tx_pa_fault
        to: "fault"
        id: "PA fault: TX On refused or the PA shut down (relays or forward power)"
      - trigger: state
        entity_id: sensor.lynx_tx_drive_control
        to: "held"
        id: "Drive control held: sudden power drop, lost reading or poor return loss"
      # Long enough for auto-recover to put it right by itself first.
      - trigger: state
        entity_id: sensor.lynx_tx_state
        to: ["muted by the SDR", "fault"]
        for: "00:01:30"
        id: "Transmitter muted or faulty for 90 s"
      # The PA on air but producing too little. Lynx-Tx checks this at
      # key-up; this catches it in service. Set the 30 to about three
      # quarters of your target.
      - trigger: template
        value_template: >-
          {{ is_state('sensor.lynx_tx_state', 'on air')
             and states('sensor.lynx_tx_forward_power') | float(0) < 30 }}
        for: "00:02:00"
        id: "Forward power low on air"
      - trigger: state
        entity_id: sensor.lynx_tx_pa_relays
        to: ["not answering", "partly on"]
        for: "00:02:00"
        id: "PA relay board: not answering or relays partly on"
      - trigger: state
        entity_id: sensor.lynx_tx_reference
        to: "holdover"
        for: "00:01:00"
        id: "10 MHz reference lost: holdover"
      - trigger: state
        entity_id: sensor.lynx_tx_camera
        to: "unstable"
        for: "00:01:00"
        id: "Camera unstable"
      # Worth knowing, not urgent: the PA cannot reach its target at full
      # drive. If it keeps happening, the PA is losing gain.
      - trigger: state
        entity_id: sensor.lynx_tx_drive_control
        to: "at maximum drive"
        for: "00:30:00"
        id: "Drive control at maximum drive for 30 minutes: PA short of target"
      # The ROCK's own health.
      - trigger: numeric_state
        entity_id: sensor.lynx_tx_rock_temperature
        above: 60
        for: "00:05:00"
        id: "ROCK too hot"
      - trigger: numeric_state
        entity_id: sensor.lynx_tx_rock_free_space
        below: 2
        id: "ROCK drive nearly full"
      - trigger: numeric_state
        entity_id: sensor.lynx_tx_rock_load
        above: 80
        for: "00:10:00"
        id: "ROCK flat out for 10 minutes"
    actions:
      - action: notify.mobile_app_your_iphone
        data:
          title: Lynx-Tx
          message: >-
            {{ trigger.id }}{% if trigger.to_state is defined and trigger.to_state %} ({{ trigger.to_state.name }}: {{ trigger.to_state.state }}){% endif %}
