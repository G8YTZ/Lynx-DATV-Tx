<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrRF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arrADC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Lynx-Tx wiring</text>
  <text x="40" y="70" font-size="14" fill="#475569">Supported: the SDR on its own cable to the ROCK's second Ethernet port. On the LAN also works, unsupported.</text>

  <!-- Drive control legend -->
  <rect x="300" y="92" width="620" height="78" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="316" y="114" font-size="14" font-weight="700" fill="#9f1239">Automatic Drive Control loop (red)</text>
  <text x="316" y="136" font-size="13" fill="#9f1239">Coupler → relay board → Modbus TCP → ROCK → SDR attenuation.</text>
  <text x="316" y="156" font-size="13" fill="#9f1239">Slow (60 to 300 s), never above the power slider; holds on a fault.</text>

  <!-- Source -->
  <rect x="40" y="275" width="170" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="125" y="309" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Camera</text>
  <text x="125" y="331" font-size="13" text-anchor="middle" fill="#475569">HDMI source, up to 4K</text>

  <!-- ROCK -->
  <rect x="290" y="200" width="310" height="240" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
  <text x="445" y="232" font-size="18" font-weight="700" text-anchor="middle" fill="#0c4a6e">Radxa ROCK 5T</text>
  <text x="445" y="254" font-size="13" text-anchor="middle" fill="#0c4a6e">Lynx-Tx: mixer, HEVC encoder,</text>
  <text x="445" y="272" font-size="13" text-anchor="middle" fill="#0c4a6e">DVB-S2 / ATSC 3.0 modulator</text>
  <text x="445" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#9f1239">Automatic Drive Control</text>
  <text x="445" y="314" font-size="13" text-anchor="middle" fill="#0c4a6e">PA sequencing, forward power check</text>
  <text x="302" y="346" font-size="12" fill="#0c4a6e">HDMI in</text>
  <text x="590" y="346" font-size="12" text-anchor="end" fill="#0c4a6e">Ethernet 2 (far right)</text>
  <text x="590" y="362" font-size="12" text-anchor="end" fill="#0c4a6e">192.168.254.1</text>
  <text x="302" y="426" font-size="12" fill="#0c4a6e">Ethernet 1: your LAN</text>

  <!-- SDR -->
  <rect x="700" y="200" width="230" height="240" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="815" y="232" font-size="18" font-weight="700" text-anchor="middle" fill="#4c1d95">SDR</text>
  <text x="815" y="254" font-size="13" text-anchor="middle" fill="#4c1d95">PlutoSky R2 or LibreSDR</text>
  <text x="815" y="272" font-size="13" text-anchor="middle" fill="#4c1d95">Tezuka firmware</text>
  <text x="815" y="298" font-size="12" text-anchor="middle" fill="#9f1239">Drive set by its attenuator</text>
  <text x="712" y="346" font-size="12" fill="#4c1d95">Ethernet</text>
  <text x="712" y="362" font-size="12" fill="#4c1d95">192.168.254.2</text>
  <text x="918" y="346" font-size="12" text-anchor="end" fill="#4c1d95">TX1</text>
  <text x="815" y="428" font-size="12" text-anchor="middle" fill="#4c1d95">10 MHz in</text>

  <!-- RF chain -->
  <rect x="1010" y="110" width="200" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1110" y="136" font-size="15" font-weight="700" text-anchor="middle" fill="#78350f">Band-pass filter</text>
  <text x="1110" y="155" font-size="12" text-anchor="middle" fill="#92400e">optional, recommended</text>
  <rect x="1010" y="210" width="200" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1110" y="238" font-size="15" font-weight="700" text-anchor="middle" fill="#78350f">Driver and PA</text>
  <text x="1110" y="258" font-size="12" text-anchor="middle" fill="#92400e">about 1 mW drive in</text>
  <rect x="1010" y="320" width="200" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1110" y="347" font-size="15" font-weight="700" text-anchor="middle" fill="#78350f">Directional coupler</text>
  <text x="1110" y="367" font-size="12" text-anchor="middle" fill="#92400e">forward (+ reflected, next PA)</text>
  <rect x="1010" y="430" width="200" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1110" y="465" font-size="15" font-weight="700" text-anchor="middle" fill="#78350f">Antenna</text>

  <!-- Modbus relay board -->
  <rect x="1270" y="200" width="200" height="210" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
  <text x="1370" y="230" font-size="16" font-weight="700" text-anchor="middle" fill="#881337">Modbus relay board</text>
  <text x="1370" y="250" font-size="12" text-anchor="middle" fill="#9f1239">ComWinTop, Modbus TCP</text>
  <text x="1284" y="280" font-size="12" fill="#881337">Coil 0: driver DC</text>
  <text x="1284" y="300" font-size="12" fill="#881337">Coil 1: PA DC</text>
  <text x="1284" y="320" font-size="12" fill="#881337">Input 4: forward power</text>
  <text x="1284" y="340" font-size="12" fill="#881337">Input 5: reflected (next PA)</text>
  <text x="1284" y="360" font-size="12" fill="#881337">Inputs 0 to 3: temperatures</text>
  <text x="1284" y="390" font-size="11" fill="#9f1239">Read by Home Assistant too</text>

  <!-- LAN and Home Assistant -->
  <rect x="290" y="600" width="310" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="445" y="630" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Home network</text>
  <text x="445" y="651" font-size="13" text-anchor="middle" fill="#475569">Web UI at http://rock:8080, updates</text>
  <rect x="40" y="600" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="135" y="630" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Home Assistant</text>
  <text x="135" y="651" font-size="12" text-anchor="middle" fill="#475569">alarms, graphs, history</text>

  <!-- GNSS reference -->
  <rect x="700" y="560" width="230" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="815" y="592" font-size="16" font-weight="700" text-anchor="middle" fill="#064e3b">Leo Bodnar</text>
  <text x="815" y="613" font-size="13" text-anchor="middle" fill="#065f46">GNSS reference, 10 MHz out</text>
  <rect x="1010" y="575" width="200" height="50" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="1110" y="605" font-size="14" text-anchor="middle" fill="#064e3b">GNSS antenna</text>

  <!-- signal links -->
  <line x1="210" y1="315" x2="288" y2="315" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="249" y="305" font-size="12" text-anchor="middle" fill="#334155">HDMI</text>
  <line x1="445" y1="442" x2="445" y2="598" stroke="#334155" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="455" y="520" font-size="12" fill="#334155">Cat 6</text>
  <line x1="230" y1="635" x2="288" y2="635" stroke="#334155" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="602" y1="335" x2="698" y2="335" stroke="#6d28d9" stroke-width="3.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="650" y="318" font-size="12" text-anchor="middle" fill="#4c1d95">Cat 6, direct</text>
  <text x="650" y="361" font-size="11" text-anchor="middle" fill="#4c1d95">IQ, ~130 Mb/s</text>
  <text x="650" y="375" font-size="11" text-anchor="middle" fill="#9f1239">+ drive setting</text>

  <line x1="1008" y1="600" x2="932" y2="600" stroke="#047857" stroke-width="2" marker-end="url(#arrRef)"/>
  <line x1="815" y1="558" x2="815" y2="442" stroke="#047857" stroke-width="2.5" marker-end="url(#arrRef)"/>
  <text x="825" y="505" font-size="12" fill="#065f46">10 MHz, SMA to MMCX</text>

  <!-- RF -->
  <path d="M932,335 L970,335 L970,140 L1008,140" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrRF)"/>
  <line x1="1110" y1="172" x2="1110" y2="208" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrRF)"/>
  <line x1="1110" y1="282" x2="1110" y2="318" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrRF)"/>
  <line x1="1110" y1="392" x2="1110" y2="428" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrRF)"/>

  <!-- relay board: DC to the PA, power reading from the coupler -->
  <line x1="1268" y1="245" x2="1212" y2="245" stroke="#be123c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrADC)"/>
  <text x="1240" y="237" font-size="11" text-anchor="middle" fill="#9f1239">DC</text>
  <line x1="1212" y1="355" x2="1268" y2="355" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrADC)"/>
  <text x="1240" y="347" font-size="11" text-anchor="middle" fill="#9f1239">0 to 10 V</text>

  <!-- relay board to the LAN: Modbus TCP -->
  <path d="M1370,412 L1370,730 L520,730 L520,672" fill="none" stroke="#be123c" stroke-width="2.5" marker-start="url(#arrADC)" marker-end="url(#arrADC)"/>
  <text x="945" y="722" font-size="12" text-anchor="middle" fill="#9f1239">Modbus TCP over the LAN: relays switched and forward power read by Lynx-Tx; also read by Home Assistant</text>

  <text x="40" y="780" font-size="12" fill="#475569">Bench testing: replace the filter, PA and antenna with a 30 to 40 dB attenuator into a receiver. The PlutoSky is powered from USB; unplug USB to restart it.</text>
</svg>
